<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 564 308" width="564" height="308" data-profile="CockpitSmall" data-screen-width="512" data-screen-height="256" data-bezel="26" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SE LCD - CockpitSmall 512x256</title>
  <defs>
    <linearGradient id="se-housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b656f"/><stop offset=".5" stop-color="#3b434a"/><stop offset="1" stop-color="#2a3035"/>
    </linearGradient>
    <linearGradient id="se-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b96a0"/><stop offset=".55" stop-color="#4c565f"/><stop offset="1" stop-color="#2c3238"/>
    </linearGradient>
    <linearGradient id="se-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".35" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#9fd0ff" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="se-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity=".22"/>
    </pattern>
  </defs>
  <g id="bezel">
    <rect x="0" y="0" width="564" height="308" rx="10.4" fill="url(#se-housing)" stroke="#0d1013" stroke-width="2"/>
    <rect x="1.5" y="1.5" width="561" height="305" rx="8.9" fill="none" stroke="#8d99a4" stroke-opacity=".35" stroke-width="1"/>
    <rect x="16.12" y="16.12" width="531.76" height="275.76" rx="0" fill="none" stroke="#12161a" stroke-opacity=".55" stroke-width="1.2"/>
    <rect x="22" y="22" width="520" height="264" rx="3" fill="#020304" stroke="#000" stroke-width="2"/>
    <rect x="25" y="25" width="514" height="258" fill="none" stroke="#7d8892" stroke-opacity=".25" stroke-width="1"/>
  </g>
  <g id="hardware"><g transform="translate(13 13) rotate(20)"><circle r="6.24" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><rect x="-4.37" y="-0.81" width="8.74" height="1.62" fill="#1a1f23"/><rect x="-0.81" y="-4.37" width="1.62" height="8.74" fill="#1a1f23"/></g><g transform="translate(551 13) rotate(70)"><circle r="6.24" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><rect x="-4.37" y="-0.81" width="8.74" height="1.62" fill="#1a1f23"/><rect x="-0.81" y="-4.37" width="1.62" height="8.74" fill="#1a1f23"/></g><g transform="translate(13 295) rotate(115)"><circle r="6.24" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><rect x="-4.37" y="-0.81" width="8.74" height="1.62" fill="#1a1f23"/><rect x="-0.81" y="-4.37" width="1.62" height="8.74" fill="#1a1f23"/></g><g transform="translate(551 295) rotate(160)"><circle r="6.24" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><rect x="-4.37" y="-0.81" width="8.74" height="1.62" fill="#1a1f23"/><rect x="-0.81" y="-4.37" width="1.62" height="8.74" fill="#1a1f23"/></g></g>
  <!-- Screen content: local coordinate system = 512x256 panel pixels -->
  <svg id="content" x="26" y="26" width="512" height="256" viewBox="0 0 512 256" overflow="hidden">
    <rect id="screen-bg" width="512" height="256" fill="#000"/>
    
    <g id="content-slot"></g>
  </svg>
  <g id="glass" pointer-events="none">
    <svg x="26" y="26" width="512" height="256" viewBox="0 0 512 256" overflow="hidden">
      <rect id="scanlines" width="512" height="256" fill="url(#se-scan)" opacity="0"/>
      <rect width="512" height="256" fill="url(#se-glass)"/>
    </svg>
  </g>
</svg>
