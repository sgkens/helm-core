<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 600" width="1112" height="600" data-profile="WideLCD" data-screen-width="1024" data-screen-height="512" data-bezel="44" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SE LCD - WideLCD 1024x512</title>
