<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" data-profile="TextPanel" data-screen-width="512" data-screen-height="512" data-bezel="44" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SE LCD - TextPanel 512x512</title>
  <defs>
    <linearGradient id="se-housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b656f"/><stop offset=".5" stop-color="#3b434a"/><stop offset="1" stop-color="#2a3035"/>
    </linearGradient>
    <linearGradient id="se-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b96a0"/><stop offset=".55" stop-color="#4c565f"/><stop offset="1" stop-color="#2c3238"/>
    </linearGradient>
    <linearGradient id="se-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".35" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#9fd0ff" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="se-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity=".22"/>
    </pattern>
  </defs>
  <g id="bezel">
    <rect x="0" y="0" width="600" height="600" rx="17.6" fill="url(#se-housing)" stroke="#0d1013" stroke-width="2"/>
    <rect x="1.5" y="1.5" width="597" height="597" rx="16.1" fill="none" stroke="#8d99a4" stroke-opacity=".35" stroke-width="1"/>
    <rect x="27.28" y="27.28" width="545.44" height="545.44" rx="0" fill="none" stroke="#12161a" stroke-opacity=".55" stroke-width="1.2"/>
    <rect x="40" y="40" width="520" height="520" rx="3" fill="#020304" stroke="#000" stroke-width="2"/>
    <rect x="43" y="43" width="514" height="514" fill="none" stroke="#7d8892" stroke-opacity=".25" stroke-width="1"/>
  </g>
  <g id="hardware"><circle cx="22" cy="22" r="13.2" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><polygon points="29.26,22 25.63,28.29 18.37,28.29 14.74,22 18.37,15.71 25.63,15.71" fill="#1f252a" stroke="#0b0e10" stroke-width=".6"/><circle cx="578" cy="22" r="13.2" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><polygon points="585.26,22 581.63,28.29 574.37,28.29 570.74,22 574.37,15.71 581.63,15.71" fill="#1f252a" stroke="#0b0e10" stroke-width=".6"/><circle cx="22" cy="578" r="13.2" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><polygon points="29.26,578 25.63,584.29 18.37,584.29 14.74,578 18.37,571.71 25.63,571.71" fill="#1f252a" stroke="#0b0e10" stroke-width=".6"/><circle cx="578" cy="578" r="13.2" fill="url(#se-metal)" stroke="#12161a" stroke-width="1"/><polygon points="585.26,578 581.63,584.29 574.37,584.29 570.74,578 574.37,571.71 581.63,571.71" fill="#1f252a" stroke="#0b0e10" stroke-width=".6"/></g>
  <!-- Screen content: local coordinate system = 512x512 panel pixels -->
  <svg id="content" x="44" y="44" width="512" height="512" viewBox="0 0 512 512" overflow="hidden">
    <rect id="screen-bg" width="512" height="512" fill="#000"/>
    
    <g id="content-slot"></g>
  </svg>
  <g id="glass" pointer-events="none">
    <svg x="44" y="44" width="512" height="512" viewBox="0 0 512 512" overflow="hidden">
      <rect id="scanlines" width="512" height="512" fill="url(#se-scan)" opacity="0"/>
      <rect width="512" height="512" fill="url(#se-glass)"/>
    </svg>
  </g>
</svg>
