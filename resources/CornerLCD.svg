<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 564 180" width="564" height="180" data-profile="CornerLCD" data-screen-width="512" data-screen-height="128" data-bezel="26" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SE LCD - CornerLCD 512x128</title>
  <defs>
    <linearGradient id="se-housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b656f"/><stop offset=".5" stop-color="#3b434a"/><stop offset="1" stop-color="#2a3035"/>
    </linearGradient>
    <linearGradient id="se-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b96a0"/><stop offset=".55" stop-color="#4c565f"/><stop offset="1" stop-color="#2c3238"/>
    </linearGradient>
    <linearGradient id="se-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".35" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#9fd0ff" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="se-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity=".22"/>
    </pattern>
  </defs>
  <g id="bezel">
    <polygon points="26,0 538,0 564,26 564,154 538,180 26,180 0,154 0,26" fill="url(#se-housing)" stroke="#0d1013" stroke-width="2"/>
    <polygon points="26,1.5 538,1.5 562.5,26 562.5,154 538,178.5 26,178.5 1.5,154 1.5,26" fill="none" stroke="#8d99a4" stroke-opacity=".35" stroke-width="1"/>
    <rect x="16.12" y="16.12" width="531.76" height="147.76" rx="0" fill="none" stroke="#12161a" stroke-opacity=".55" stroke-width="1.2"/>
    <rect x="22" y="22" width="520" height="136" rx="3" fill="#020304" stroke="#000" stroke-width="2"/>
    <rect x="25" y="25" width="514" height="130" fill="none" stroke="#7d8892" stroke-opacity=".25" stroke-width="1"/>
  </g>
  <g id="hardware"><line x1="2.6" y1="96.24" x2="15.08" y2="83.76" stroke="#7d8892" stroke-width="4.42" stroke-linecap="round"/><line x1="2.6" y1="97.24" x2="15.08" y2="84.76" stroke="#12161a" stroke-width="1.55" stroke-linecap="round" opacity=".6"/><line x1="10.92" y1="96.24" x2="23.4" y2="83.76" stroke="#7d8892" stroke-width="4.42" stroke-linecap="round"/><line x1="10.92" y1="97.24" x2="23.4" y2="84.76" stroke="#12161a" stroke-width="1.55" stroke-linecap="round" opacity=".6"/><line x1="540.6" y1="96.24" x2="553.08" y2="83.76" stroke="#7d8892" stroke-width="4.42" stroke-linecap="round"/><line x1="540.6" y1="97.24" x2="553.08" y2="84.76" stroke="#12161a" stroke-width="1.55" stroke-linecap="round" opacity=".6"/><line x1="548.92" y1="96.24" x2="561.4" y2="83.76" stroke="#7d8892" stroke-width="4.42" stroke-linecap="round"/><line x1="548.92" y1="97.24" x2="561.4" y2="84.76" stroke="#12161a" stroke-width="1.55" stroke-linecap="round" opacity=".6"/></g>
  <!-- Screen content: local coordinate system = 512x128 panel pixels -->
  <svg id="content" x="26" y="26" width="512" height="128" viewBox="0 0 512 128" overflow="hidden">
    <rect id="screen-bg" width="512" height="128" fill="#000"/>
    
    <g id="content-slot"></g>
  </svg>
  <g id="glass" pointer-events="none">
    <svg x="26" y="26" width="512" height="128" viewBox="0 0 512 128" overflow="hidden">
      <rect id="scanlines" width="512" height="128" fill="url(#se-scan)" opacity="0"/>
      <rect width="512" height="128" fill="url(#se-glass)"/>
    </svg>
  </g>
</svg>
