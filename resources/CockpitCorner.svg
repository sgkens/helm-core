<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 180" width="308" height="180" data-profile="CockpitCorner" data-screen-width="256" data-screen-height="128" data-bezel="26" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SE LCD - CockpitCorner 256x128</title>
  <defs>
    <linearGradient id="se-housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b656f"/><stop offset=".5" stop-color="#3b434a"/><stop offset="1" stop-color="#2a3035"/>
    </linearGradient>
    <linearGradient id="se-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b96a0"/><stop offset=".55" stop-color="#4c565f"/><stop offset="1" stop-color="#2c3238"/>
    </linearGradient>
    <linearGradient id="se-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".35" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".36" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#9fd0ff" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="se-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity=".22"/>
    </pattern>
  </defs>
  <g id="bezel">
    <rect x="0" y="0" width="308" height="180" rx="10.4" fill="url(#se-housing)" stroke="#0d1013" stroke-width="2"/>
    <rect x="1.5" y="1.5" width="305" height="177" rx="8.9" fill="none" stroke="#8d99a4" stroke-opacity=".35" stroke-width="1"/>
    <rect x="16.12" y="16.12" width="275.76" height="147.76" rx="0" fill="none" stroke="#12161a" stroke-opacity=".55" stroke-width="1.2"/>
    <rect x="22" y="22" width="264" height="136" rx="3" fill="#020304" stroke="#000" stroke-width="2"/>
    <rect x="25" y="25" width="258" height="130" fill="none" stroke="#7d8892" stroke-opacity=".25" stroke-width="1"/>
  </g>
  <g id="hardware"><polyline points="6.24,81.21 19.76,90 6.24,98.79" fill="none" stroke="#7d8892" stroke-width="4.16" stroke-linecap="round" stroke-linejoin="round"/><polyline points="301.76,81.21 288.24,90 301.76,98.79" fill="none" stroke="#7d8892" stroke-width="4.16" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- Screen content: local coordinate system = 256x128 panel pixels -->
  <svg id="content" x="26" y="26" width="256" height="128" viewBox="0 0 256 128" overflow="hidden">
    <rect id="screen-bg" width="256" height="128" fill="#000"/>
    
    <g id="content-slot"></g>
  </svg>
  <g id="glass" pointer-events="none">
    <svg x="26" y="26" width="256" height="128" viewBox="0 0 256 128" overflow="hidden">
      <rect id="scanlines" width="256" height="128" fill="url(#se-scan)" opacity="0"/>
      <rect width="256" height="128" fill="url(#se-glass)"/>
    </svg>
  </g>
</svg>
