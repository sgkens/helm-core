<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELM Webutil</title>
  <meta name="description" content="Write a HELM layout and see it rendered by the real script, in the browser.">
  <link rel="icon" type="image/x-icon" href="/assets/helm-core-logo-256x256.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    try { var t = localStorage.getItem('helm_docs_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <style>
    /* Small, page-specific layout only; everything else is the docs site's compiled Tailwind/daisyUI. */
    .webutil-grid { display: grid; grid-template-columns: 300px 1fr 320px; grid-template-rows: 1fr 220px; gap: 0.75rem; height: calc(100vh - 3.25rem); }
    @media (max-width: 1024px) { .webutil-grid { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; height: auto; } }
    #preview-stage svg { max-width: 100%; max-height: 100%; }
    #dsl-editor { tab-size: 2; }
    .btn-2xs { height: 1.25rem; min-height: 1.25rem; font-size: 0.6875rem; }
  </style>
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased font-sans">
  <header class="navbar bg-base-200/80 backdrop-blur border-b border-base-300 px-4 gap-2 h-13">
    <div class="flex-none">
      <a href="/docs/" class="flex items-center gap-2 px-1">
        <img src="/assets/helm-core-logo-256x256.webp" alt="" width="24" height="24" class="w-6 h-6 rounded">
        <span class="font-mono font-black tracking-wider hidden sm:inline"><span class="text-primary">HELM</span> Core</span>
      </a>
    </div>
    <div class="flex-1 font-mono text-sm text-base-content/60">webutil <span class="badge badge-xs badge-outline ml-1">alpha</span></div>
    <div class="flex-none flex items-center gap-2">
      <a href="/docs/dsl-syntax/" class="btn btn-ghost btn-xs font-mono" target="_blank" rel="noopener">DSL reference</a>
      <a href="/docs/getting-started/" class="btn btn-ghost btn-xs font-mono" target="_blank" rel="noopener">Getting started</a>
    </div>
  </header>

  <main class="p-3">
    <div class="webutil-grid">

      <!-- Left: block / field reference -->
      <aside class="bg-base-200/50 border border-base-300 rounded-lg p-2 overflow-y-auto" style="grid-row: 1 / span 2;">
        <label class="input input-sm input-bordered flex items-center gap-2 mb-2 font-mono">
          <input id="block-search" type="search" class="grow" placeholder="Search blocks or fields...">
        </label>
        <div class="tabs tabs-boxed tabs-xs mb-2">
          <button type="button" class="tab tab-active" data-tab="blocks">Blocks</button>
          <button type="button" class="tab" data-tab="items">Item / LCD fields</button>
        </div>
        <div id="block-palette" data-tabpanel="blocks"></div>
        <div id="item-fields" data-tabpanel="items" class="hidden"></div>
        <p class="text-[11px] text-base-content/40 mt-2">Click a field to insert a <code>line:</code> using it at the cursor. Field lists come from the block matrix, so they cannot drift from the docs.</p>
      </aside>

      <!-- Centre: live preview -->
      <section class="bg-base-200/50 border border-base-300 rounded-lg p-2 flex flex-col min-w-0">
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <select id="starter-picker" class="select select-xs select-bordered font-mono"></select>
          <select id="profile-picker" class="select select-xs select-bordered font-mono"></select>
          <span id="screen-picker-wrap" class="hidden">
            <select id="screen-picker" class="select select-xs select-bordered font-mono"></select>
          </span>
          <button type="button" id="play-toggle" class="btn btn-xs font-mono">Pause animation</button>
          <span id="preview-status" class="text-xs font-mono text-base-content/50 ml-auto"></span>
        </div>
        <div id="preview-stage" class="flex-1 flex items-center justify-center min-h-0 overflow-hidden">
          <p class="text-base-content/40 font-mono text-sm">Loading the renderer…</p>
        </div>
        <div id="issues" class="mt-2 max-h-24 overflow-y-auto space-y-0.5 hidden"></div>
      </section>

      <!-- Right: telemetry sliders -->
      <aside class="bg-base-200/50 border border-base-300 rounded-lg p-2 overflow-y-auto">
        <div class="text-xs font-mono text-base-content/60 mb-2">Telemetry (drives the preview; not saved to the layout)</div>
        <div id="value-sliders" class="space-y-1.5"></div>
      </aside>

      <!-- Bottom: DSL editor -->
      <section class="bg-base-200/50 border border-base-300 rounded-lg p-2 flex flex-col min-w-0" style="grid-column: 2 / span 2;">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-xs font-mono text-base-content/60">Custom Data</span>
          <button type="button" id="copy-dsl" class="btn btn-xs btn-primary font-mono ml-auto">Copy</button>
        </div>
        <textarea id="dsl-editor" class="textarea textarea-bordered font-mono text-xs flex-1 resize-none" spellcheck="false"></textarea>
      </section>

    </div>
  </main>

  <script type="module">
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("tab-active"));
        tab.classList.add("tab-active");
        document.querySelectorAll("[data-tabpanel]").forEach((p) => p.classList.toggle("hidden", p.dataset.tabpanel !== tab.dataset.tab));
      });
    });
  </script>
  <script type="module" src="./js/app.mjs"></script>
</body>
</html>
